{% load audix %}{% if page.has_other_pages %}<nav class="row between" style="margin-top:12px" aria-label="Pages"><span class="muted small">Page {{ page.number }} of {{ page.paginator.num_pages }} · {{ page.paginator.count }} total</span><span class="row">{% if page.has_previous %}<a class="btn btn-sm" href="{% querystring_with page=page.previous_page_number %}">Previous</a>{% endif %}{% if page.has_next %}<a class="btn btn-sm" href="{% querystring_with page=page.next_page_number %}">Next</a>{% endif %}</span></nav>{% endif %}
