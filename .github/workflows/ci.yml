name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: audix
          POSTGRES_PASSWORD: audix
          POSTGRES_DB: audix
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U audix" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://audix:audix@localhost:5432/audix
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q --create-db
      - run: pip-audit -r requirements.txt
      - name: Deploy checks
        run: python manage.py check --deploy --fail-level ERROR
        env:
          DEBUG: "0"
          SECRET_KEY: ci-only-not-secret-0123456789abcdefghijklmnopqrstuvwxyz
          ALLOWED_HOSTS: example.com
